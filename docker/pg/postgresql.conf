# Cấu hình nền PostgreSQL 16 cho thí nghiệm (cấu hình BỀN VỮNG mặc định).
# Script thí nghiệm đổi tham số bằng ALTER SYSTEM (ghi vào postgresql.auto.conf, ưu tiên hơn file này).
listen_addresses = '*'
max_connections = 200

# Bộ nhớ (bằng innodb_buffer_pool_size bên MySQL)
shared_buffers = 2GB

# WAL và độ bền
wal_level = replica
fsync = on
synchronous_commit = on
full_page_writes = on
wal_buffers = 16MB
wal_writer_delay = 200ms

# Checkpoint
checkpoint_timeout = 5min
max_wal_size = 4GB
min_wal_size = 1GB
checkpoint_completion_target = 0.9

# Giữ WAL lại để pg_waldump đọc được sau mỗi lần chạy (cần ~8 GB đĩa trống)
wal_keep_size = 8GB

# Ghi log để đọc thời gian checkpoint / phục hồi
log_checkpoints = on
log_min_messages = info
log_line_prefix = '%m [%p] '
track_wal_io_timing = on
track_io_timing = on
