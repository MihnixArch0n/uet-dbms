[project]
name = "btl-durability"
version = "0.1.0"
description = "Durability va Crash Recovery: PostgreSQL vs MySQL InnoDB (BTL INT3202)"
requires-python = ">=3.10"
dependencies = [
    "psycopg[binary]>=3.1",   # crash_client.py ket noi PostgreSQL
    "pymysql>=1.1",           # crash_client.py ket noi MySQL
    "cryptography>=41",       # PyMySQL can de dang nhap MySQL 8 (caching_sha2_password)
    "pandas>=2.0",            # analysis/parse_results.py
    "matplotlib>=3.7",        # analysis/plots.py
]

[tool.uv]
package = false   # day la bo script, khong phai thu vien can dong goi
